# Phase 3: load balancer in front of the three agent replicas
# (Agent 1-a / 1-b / 1-c in the diagram). No sticky sessions: session
# state lives in Redis and memory in pgvector/Firestore, so any replica
# serves any user on any turn.
upstream agent_backend {
    least_conn;
    server agent-1a:8000;
    server agent-1b:8000;
    server agent-1c:8000;
}

server {
    listen 8000;

    location / {
        proxy_pass http://agent_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;   # LLM turns can take a while
    }
}
