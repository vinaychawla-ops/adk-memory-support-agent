# Phase 2 durable backends (local Docker) + Phase 3 serving (replicas + LB).
#
# Bring everything up with:
#   docker compose up -d --build
#
# Ports (host):
#   8000  nginx load balancer -> the 3 agent replicas (the only public entry)
#   6379  redis (sessions)
#   5432  pgvector (episodic memory)
#   8080  firestore emulator (semantic memory)
# Replicas listen on :8000 inside the compose network only.
#
# Data survives `docker compose stop/start` (pgdata/redisdata volumes);
# `down -v` wipes it. The Firestore emulator needs no credentials; the
# client honors FIRESTORE_EMULATOR_HOST automatically.
#
# Live turns need a key: GOOGLE_API_KEY=... docker compose up -d --build
# (without it, /health works and /chat returns a 500 naming the missing key).

services:
  # --- Phase 2: memory handling ------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  firestore:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: >
      gcloud beta emulators firestore start
      --host-port=0.0.0.0:8080
      --project=demo-memory-agent
    ports:
      - "8080:8080"

  # --- Phase 3: agent replicas (Agent 1-a / 1-b / 1-c) --------------------------
  # Identical images; any replica serves any user because session state
  # lives in Redis and memory in pgvector/Firestore -- no sticky sessions.
  # (environment is repeated per replica: YAML merge keys do not deep-merge.)
  agent-1a:
    build: .
    depends_on:
      - redis
      - pgvector
      - firestore
    environment:
      REPLICA_ID: agent-1a
      SESSION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      EPISODIC_BACKEND: pgvector
      PGVECTOR_DSN: postgresql://memory:memory@pgvector:5432/memory
      EMBEDDER: fake
      SEMANTIC_BACKEND: firestore
      FIRESTORE_EMULATOR_HOST: firestore:8080
      FIRESTORE_PROJECT: demo-memory-agent
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  agent-1b:
    build: .
    depends_on:
      - redis
      - pgvector
      - firestore
    environment:
      REPLICA_ID: agent-1b
      SESSION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      EPISODIC_BACKEND: pgvector
      PGVECTOR_DSN: postgresql://memory:memory@pgvector:5432/memory
      EMBEDDER: fake
      SEMANTIC_BACKEND: firestore
      FIRESTORE_EMULATOR_HOST: firestore:8080
      FIRESTORE_PROJECT: demo-memory-agent
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  agent-1c:
    build: .
    depends_on:
      - redis
      - pgvector
      - firestore
    environment:
      REPLICA_ID: agent-1c
      SESSION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      EPISODIC_BACKEND: pgvector
      PGVECTOR_DSN: postgresql://memory:memory@pgvector:5432/memory
      EMBEDDER: fake
      SEMANTIC_BACKEND: firestore
      FIRESTORE_EMULATOR_HOST: firestore:8080
      FIRESTORE_PROJECT: demo-memory-agent
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

  # --- Phase 3: load balancer ---------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - agent-1a
      - agent-1b
      - agent-1c
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  redisdata:
  pgdata:
