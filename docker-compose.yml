# Phase 2 durable backends (local Docker). Bring up with:
#   docker compose up -d
# Then run the integration tests (see README.md "Phase 2" section):
#   SESSION_BACKEND=redis EPISODIC_BACKEND=pgvector SEMANTIC_BACKEND=firestore \
#     ~/workspace/.venv-adk/bin/python -m pytest tests/ -q -m integration
#
# Data survives `docker compose stop/start` (pgdata volume); `down -v`
# wipes it. The Firestore emulator needs no credentials; the client
# honors FIRESTORE_EMULATOR_HOST automatically.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  firestore:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: >
      gcloud beta emulators firestore start
      --host-port=0.0.0.0:8080
      --project=demo-memory-agent
    ports:
      - "8080:8080"

volumes:
  redisdata:
  pgdata:
